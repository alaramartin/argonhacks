<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock Mutual Claim</title>
  <style>
    :root { --bg: #f6f5f1; --card: #fff; --line: #e2e0d8; --text: #1d1d1b; --muted: #6b6a64; --accent: #1f5f4a; --warn: #a15c00; --bad: #b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
    header { background: var(--accent); color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    header b { font-size: 18px; }
    header small { opacity: 0.8; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 12px; }
    .status { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: #fff4e0; color: var(--warn); }
    .status.submitted { background: #e3f3ec; color: var(--accent); }
    dl { display: grid; grid-template-columns: 220px 1fr; gap: 8px 16px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; min-height: 1.5em; }
    dd.empty { color: #b8b6ad; font-style: italic; }
    .flash { animation: flash 1.2s ease-out; }
    @keyframes flash { from { background: #fff1b8; } to { background: transparent; } }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    td.num { text-align: right; white-space: nowrap; }
    td small { color: var(--muted); display: block; }
    td a { color: var(--accent); }
    tfoot td { font-weight: 700; border-bottom: 0; }
    .actions { display: flex; gap: 12px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
    button { font: inherit; border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: #fff; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #msg { color: var(--muted); font-size: 13px; }
    @media (max-width: 640px) { dl { grid-template-columns: 1fr; } dt { margin-top: 6px; } }
  </style>
</head>
<body>
  <header><b>Mock Mutual</b><small>Demo claims portal. Not a real insurer.</small></header>
  <main>
    <div class="card">
      <h1>Contents claim <span id="status" class="status">draft</span></h1>
      <p id="note" style="margin:0;color:var(--muted)">Your claim assistant is filling this in. Nothing is sent to the insurer until you review it and press Submit.</p>
    </div>
    <div class="card">
      <h2>Claim details</h2>
      <dl id="fields"></dl>
    </div>
    <div class="card">
      <h2>Items claimed</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Item</th><th>Qty</th><th class="num">Replacement cost</th><th>Evidence and valuation</th></tr></thead>
          <tbody id="items"></tbody>
          <tfoot><tr><td colspan="3">Total claimed</td><td class="num" id="total">$0</td><td></td></tr></tfoot>
        </table>
      </div>
    </div>
    <div class="card actions">
      <span id="msg"></span>
      <button id="reset" type="button">Start over</button>
      <button id="submit" class="primary" type="button" disabled>Review complete, submit claim</button>
    </div>
  </main>
  <script>
    const LABELS = {};
    let last = "";
    const money = (n) => "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    async function load() {
      const form = await (await fetch("/api/form")).json();
      for (const f of form.claim_fields) LABELS[f.name] = f.label;
      poll();
      setInterval(poll, 1000);
    }

    async function poll() {
      const c = await (await fetch("/api/claim", { cache: "no-store" })).json();
      const text = JSON.stringify(c);
      if (text === last) return;
      const prev = last ? JSON.parse(last) : null;
      last = text;

      const st = document.getElementById("status");
      st.textContent = c.status;
      st.className = "status " + c.status;

      const dl = document.getElementById("fields");
      dl.innerHTML = "";
      for (const [name, label] of Object.entries(LABELS)) {
        const dt = document.createElement("dt"); dt.textContent = label;
        const dd = document.createElement("dd");
        const v = c.fields[name];
        dd.textContent = v ?? "not filled yet";
        if (!v) dd.className = "empty";
        else if (prev && prev.fields[name] !== v) dd.className = "flash";
        dl.append(dt, dd);
      }

      const tb = document.getElementById("items");
      tb.innerHTML = "";
      c.items.forEach((it, i) => {
        const tr = document.createElement("tr");
        if (prev && (!prev.items[i] || JSON.stringify(prev.items[i]) !== JSON.stringify(it))) tr.className = "flash";
        const cell = (t, cls) => { const td = document.createElement("td"); if (cls) td.className = cls; td.textContent = t; return td; };
        const ev = document.createElement("td");
        ev.append(document.createTextNode(it.evidence));
        const basis = document.createElement("small"); basis.textContent = it.valuation_basis; ev.append(basis);
        if (it.notes) { const n = document.createElement("small"); n.textContent = "Note: " + it.notes; ev.append(n); }
        if (it.attachment) {
          const img = document.createElement("img");
          img.src = it.attachment; img.alt = "Before and after evidence photo";
          img.style.cssText = "display:block;max-width:100%;width:320px;margin-top:6px;border-radius:6px;border:1px solid var(--line)";
          ev.append(img);
        }
        for (const u of String(it.sources || "").split(/[\s,]+/).filter((s) => s.startsWith("http"))) {
          const a = document.createElement("a"); a.href = u; a.target = "_blank"; a.rel = "noopener";
          try { a.textContent = new URL(u).hostname.replace(/^www\./, ""); } catch { a.textContent = u; }
          const s = document.createElement("small"); s.append(a); ev.append(s);
        }
        tr.append(cell(i + 1), cell(it.description), cell(it.quantity), cell(money(it.replacement_cost), "num"), ev);
        tb.append(tr);
      });
      document.getElementById("total").textContent = money(c.total || 0);
      const done = c.status === "submitted";
      document.getElementById("submit").disabled = done || !c.items.length;
      document.getElementById("note").textContent = done
        ? "Submitted. Your claim is with Mock Mutual."
        : "Your claim assistant is filling this in. Nothing is sent to the insurer until you review it and press Submit.";
    }

    document.getElementById("submit").addEventListener("click", async () => {
      const r = await fetch("/api/claim/submit", { method: "POST" });
      document.getElementById("msg").textContent = r.ok ? "" : (await r.json()).error;
      poll();
    });
    document.getElementById("reset").addEventListener("click", async () => {
      await fetch("/api/claim/reset", { method: "POST" });
      document.getElementById("msg").textContent = "";
      poll();
    });
    load();
  </script>
</body>
</html>
