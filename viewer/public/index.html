<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proof of Loss</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="stage">
    <div id="scene"></div>
    <header id="title">
      <h1>Proof of Loss</h1>
      <p id="summary">Loading inventory…</p>
    </header>
    <div id="fidelity" hidden></div>
    <figure id="catch" hidden>
      <button aria-label="Close">×</button>
      <figcaption>Loop caught a reconstruction error</figcaption>
      <img alt="Real video frame next to the rendered scene" />
      <p></p>
    </figure>
    <section id="after" aria-label="After the loss">
      <div class="views" role="group" aria-label="Scene">
        <button type="button" data-view="before" class="on">Before</button>
        <button type="button" data-view="after" disabled>After</button>
      </div>
      <label class="upload">
        <input type="file" accept="video/mp4,video/quicktime,.mov,.mp4,.m4v" hidden />
        <span>Upload after video</span>
      </label>
      <p id="after-status"></p>
      <div id="stolen" hidden>
        <h3>Stolen <span id="stolen-total"></span></h3>
        <ol id="stolen-list"></ol>
        <button id="file-claim" type="button">File claim</button>
        <a id="portal-link" href="http://localhost:8090" target="_blank" rel="noopener">Open claim portal</a>
      </div>
    </section>
    <div id="legend">
      <span><i class="swatch present"></i>present</span>
      <span><i class="swatch moved"></i>moved</span>
      <span><i class="swatch stolen"></i>stolen</span>
    </div>
    <div id="nav" role="group" aria-label="Move the camera">
      <div class="pad">
        <button type="button" data-nav="rotL" title="Rotate left (Q)" aria-label="Rotate left">⟲</button>
        <button type="button" data-nav="fwd" title="Move forward (↑ or W)" aria-label="Move forward">▲</button>
        <button type="button" data-nav="rotR" title="Rotate right (E)" aria-label="Rotate right">⟳</button>
        <button type="button" data-nav="left" title="Move left (← or A)" aria-label="Move left">◀</button>
        <button type="button" id="reset-view" title="Reset view (0)" aria-label="Reset view">⌂</button>
        <button type="button" data-nav="right" title="Move right (→ or D)" aria-label="Move right">▶</button>
        <button type="button" data-nav="tiltUp" title="Look more from above (R)" aria-label="Tilt up">⤒</button>
        <button type="button" data-nav="back" title="Move back (↓ or S)" aria-label="Move back">▼</button>
        <button type="button" data-nav="tiltDown" title="Look more from the side (F)" aria-label="Tilt down">⤓</button>
      </div>
      <div class="zoom">
        <button type="button" data-nav="in" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button type="button" data-nav="out" title="Zoom out (−)" aria-label="Zoom out">−</button>
      </div>
    </div>
  </main>

  <aside id="activity">
    <h2>Agent activity <span id="live" class="live">●</span></h2>
    <ol id="feed"></ol>
  </aside>

  <dialog id="evidence">
    <form method="dialog"><button aria-label="Close">×</button></form>
    <h3 id="ev-title"></h3>
    <p id="ev-meta"></p>
    <video id="ev-video" src="/video" muted controls preload="metadata"></video>
    <p id="ev-novideo" hidden>No before-video at fixtures/before.mp4 yet.</p>
    <ul id="ev-sources"></ul>
  </dialog>

  <script type="module" src="main.js"></script>
</body>
</html>
